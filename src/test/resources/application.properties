# 테스트에서만 덮어쓰는 값.
#
# 파일 이름을 application.yml 로 두면 안 된다 — 같은 이름은 병합이 아니라
# main 쪽 application.yml 을 통째로 가려버려서, 타임아웃·경로 같은 나머지 설정이
# 사라지고 컨텍스트가 뜨지 않는다. properties 는 yml 과 함께 읽히고 여기가 이긴다.
#
# 앨범 기능 때문에 게이트웨이가 DB 를 갖게 됐지만 **테스트가 MySQL 을 요구하면 안 된다.**
# 도커를 띄우지 않고도 릴레이·검증 테스트가 그대로 돌아야 한다.
spring.datasource.url=jdbc:h2:mem:zooearly;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
